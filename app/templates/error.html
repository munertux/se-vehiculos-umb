{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="panel error-pagina">
  <p class="codigo">{{ codigo }}</p>
  <h1>{{ titulo }}</h1>
  <p class="texto-2">{{ mensaje }}</p>
  <p style="margin-top:20px">
    {% if usuario_actual %}<a class="boton primario" href="{{ url_for('inicio') }}">Ir a mi panel</a>
    {% else %}<a class="boton primario" href="{{ url_for('autenticacion.login') }}">Ir al ingreso</a>{% endif %}
  </p>
</div>
{% endblock %}
